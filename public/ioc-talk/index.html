/* Layout: one-screen speaker deck. Top bar (card no. + timer), the card fills the middle, segmented progress + next-card cue at the bottom. Single light theme by choice. */
:root {
  --paper: #ffffff;
  --ink: #0b0f1c;
  --muted: #5b6478;
  --line: #e3e6ef;
  --wash: #f3f5fa;
  --pigeon: #4a3fb8;      /* neck-feather violet */
  --pigeon-2: #1f8f86;    /* neck-feather teal */
  --warn: #c2410c;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  max-width: 760px;
  margin: 0 auto;
  box-sizing: border-box;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.count {
  font-family: var(--display);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.count b { color: var(--ink); }
.tools { display: flex; gap: 8px; align-items: center; }
button {
  font: inherit;
  color: var(--ink);
  background: var(--wash);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--pigeon); outline-offset: 2px; }
.timer {
  font-family: var(--display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 5.6em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.timer .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted);
}
.timer.running .dot { background: var(--pigeon-2); }
.timer.late { color: var(--warn); border-color: var(--warn); }
.timer.late .dot { background: var(--warn); }

.stage {
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-block: 16px;
  overflow-y: auto;
}
.tap { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 2fr; z-index: 0; }
.tap div { cursor: pointer; }
.card { position: relative; z-index: 1; pointer-events: none; min-width: 0; }
.eyebrow {
  font-family: var(--display);
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--pigeon-2);
  display: flex;
  gap: 10px;
  align-items: center;
}
.eyebrow .pace { color: var(--muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.6rem, 11vw, 4.2rem);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 6px 0 24px;
  text-wrap: balance;
  background: linear-gradient(100deg, var(--pigeon) 0%, var(--pigeon-2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
li {
  font-size: clamp(1.6rem, 6.4vw, 2.3rem);
  font-weight: 700;
  line-height: 1.28;
  letter-spacing: 0.005em;
  padding-left: 26px;
  position: relative;
}
li::before {
  content: "";
  position: absolute;
  left: 0; top: 0.5em;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--pigeon);
}
.unsure { color: var(--muted); }

.bottom { display: flex; flex-direction: column; gap: 12px; }
.next {
  font-size: 1.15rem;
  color: var(--muted);
  min-height: 1.4em;
}
.next b { color: var(--ink); font-weight: 700; }
.nav { display: flex; gap: 10px; align-items: center; }
.nav button { flex: 0 0 auto; }
.nav .go {
  flex: 1;
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  font-weight: 700;
  padding: 14px;
}
.segs { display: flex; gap: 4px; flex: 1; }
.segs span {
  flex: 1; height: 5px; border-radius: 3px; background: var(--line);
}
.segs span.done { background: var(--pigeon); }
.segs span.now { background: var(--pigeon-2); }

/* overview */
.overview {
  position: fixed; inset: 0; z-index: 20;
  background: var(--paper);
  overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.overview .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.overview header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.overview h2 { font-family: var(--display); font-size: 1.3rem; margin: 0; }
.ov-item {
  text-align: left;
  border-radius: 14px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 2.2em 1fr auto;
  gap: 10px;
  align-items: baseline;
  background: var(--paper);
}
.ov-item .n { font-family: var(--display); font-weight: 700; color: var(--pigeon); font-variant-numeric: tabular-nums; }
.ov-item .t { font-weight: 700; }
.ov-item .s { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.ov-item.current { border-color: var(--pigeon-2); box-shadow: inset 3px 0 0 var(--pigeon-2); }
.hint { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

@media (prefers-reduced-motion: no-preference) {
  .card.enter { animation: rise 220ms ease-out; }
  @keyframes rise { from { opacity: 0.2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="count" id="count"><b>1</b> / 8</div>
    <div class="tools">
      <button id="timer" class="timer" aria-label="Start or pause timer"><span class="dot"></span><span id="clock">0:00</span></button>
      <button id="reset" aria-label="Reset timer">Reset</button>
      <button id="all" aria-label="Show all cards">All</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="tap"><div id="tapPrev" aria-hidden="true"></div><div id="tapNext" aria-hidden="true"></div></div>
    <div class="card" id="card">
      <div class="eyebrow"><span id="kicker"></span><span class="pace" id="pace"></span></div>
      <h1 id="title"></h1>
      <ul id="lines"></ul>
    </div>
  </div>

  <div class="bottom">
    <div class="next" id="next"></div>
    <div class="nav">
      <button id="prev" aria-label="Previous card">Back</button>
      <div class="segs" id="segs"></div>
      <button id="go" class="go" aria-label="Next card">Next</button>
    </div>
  </div>
</div>

<div class="overview" id="overview" hidden>
  <div class="inner">
    <header><h2>Hyper-Urban Islands of Coherence</h2><button id="close">Close</button></header>
    <div id="ovList" style="display:flex;flex-direction:column;gap:10px"></div>
    <p class="hint">Tap the right side of a card to advance, the left side to go back. Swipe and arrow keys work too. Target pace adds up to about 5 minutes.</p>
  </div>
</div>

<script>
const CARDS = [
  { t: "Venezuela", s: 35, l: [
    "Doctor. Decentralized, affordable care.",
    "As the dictatorship worsened, he became more valuable.",
    "As things get worse, things get better."
  ]},
  { t: "Escaping", s: 30, l: [
    "Thinking of escaping...",
    "And yet, when we think of civs that collapsed: Tripoli, Beirut, Pyongyang.",
    "Cities have been here and will probably continue to be here for a very long time."
  ]},
  { t: "Why NYC", s: 20, l: [
    "But curious to figure out what to do in a place like NYC.",
    "NYC is like the Amazon rainforest of urban ecologies."
  ]},
  { t: "Why me", s: 25, l: [
    "I moved to NYC 3 years ago and felt lonely.",
    "Cool metacrisis people [scattered?], mostly transient."
  ]},
  { t: "What it is", s: 30, l: [
    "From meta-curious to meta-informed.",
    "From tragic to post-tragic.",
    "A space to be uncomfortable together."
  ]},
  { t: "Proof", s: 30, l: [
    "Over the last 18 months, 1,400 people came through 72 events. Grassroots.",
    "Data collected, mapped, built on Vincent's infrastructure.",
    "Now we're at the scale where we can cherry-pick [individual?] matches."
  ]},
  { t: "What's emerged", s: 40, l: [
    "The ground-up strategy initially felt random.",
    "But this low-stakes group is the perfect testbed to trial emergence.",
    "A nonprofit started. We're shifting from learning to doing.",
    "During Climate Week, we hosted 25 events and sold out half of them, with Allie and friends like Denizen, Nate Hagens, and BFI."
  ]},
  { t: "The question", s: 40, l: [
    "The big question I have, and in part why I'm here: what next?",
    "What experiments to run next? With whom?",
    "What does it look like to expand? Acquire collective infrastructure?",
    "Develop a living civic laboratory that can not only exist in the current system but thrive amidst civilizational rupture?"
  ]},
  { t: "Creationships", s: 20, l: [
    "This inquiry started off as a desire to shift from friendships to creationships.",
    "So if that's you, hit me up."
  ]},
  { t: "This time is unique", s: 30, l: [
    "Like in Venezuela, collapse is an opportunity.",
    "A unique opportunity to leverage discomfort to draw people into a brand new sense of possibility.",
    "This time is unique."
  ]}
];
const TOTAL = 300;
const $ = id => document.getElementById(id);
const fmt = sec => Math.floor(sec / 60) + ":" + String(Math.floor(sec % 60)).padStart(2, "0");
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const mark = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="unsure">[$1]</span>');

let i = 0;
try { const v = parseInt(localStorage.getItem("ioc-card"), 10); if (v >= 0 && v < CARDS.length) i = v; } catch (e) {}

// cumulative target end time for each card
const ends = []; CARDS.reduce((a, c, k) => (ends[k] = a + c.s), 0);

$("segs").innerHTML = CARDS.map(() => "<span></span>").join("");

function render() {
  const c = CARDS[i];
  $("count").innerHTML = "<b>" + (i + 1) + "</b> / " + CARDS.length;
  $("kicker").textContent = "Card " + (i + 1);
  $("pace").textContent = "~" + c.s + "s · aim to finish by " + fmt(ends[i]);
  $("title").textContent = c.t;
  $("lines").innerHTML = c.l.map(x => "<li>" + mark(x) + "</li>").join("");
  const n = CARDS[i + 1];
  $("next").innerHTML = n ? "Next: <b>" + esc(n.t) + "</b>" : "Last card";
  $("go").textContent = n ? "Next" : "Done";
  [...$("segs").children].forEach((s, k) => s.className = k < i ? "done" : k === i ? "now" : "");
  $("prev").disabled = i === 0;
  const card = $("card"); card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  $("stage").scrollTop = 0;
  try { localStorage.setItem("ioc-card", i); } catch (e) {}
}
function go(d) {
  const j = Math.min(CARDS.length - 1, Math.max(0, i + d));
  if (j !== i) { i = j; render(); }
  if (!running && d > 0 && elapsed === 0) toggle();
}

// timer
let running = false, elapsed = 0, startAt = 0, tick = null, lock = null;
function now() { return running ? elapsed + (Date.now() - startAt) / 1000 : elapsed; }
function paint() {
  const e = now();
  $("clock").textContent = fmt(e) + " / " + fmt(TOTAL);
  $("timer").classList.toggle("running", running);
  $("timer").classList.toggle("late", e > ends[i] + 10 || e > TOTAL);
}
async function toggle() {
  if (running) { elapsed = now(); running = false; clearInterval(tick); releaseLock(); }
  else { startAt = Date.now(); running = true; tick = setInterval(paint, 250); getLock(); }
  paint();
}
async function getLock() { try { if ("wakeLock" in navigator) lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
function releaseLock() { try { lock && lock.release(); } catch (e) {} lock = null; }
document.addEventListener("visibilitychange", () => { if (running && document.visibilityState === "visible") getLock(); });

$("timer").onclick = toggle;
$("reset").onclick = () => { running = false; clearInterval(tick); elapsed = 0; releaseLock(); paint(); };
$("go").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("tapNext").onclick = () => go(1);
$("tapPrev").onclick = () => go(-1);

// swipe
let sx = null, sy = null;
$("stage").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("stage").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
  sx = null;
});

// keys
document.addEventListener("keydown", e => {
  if (!$("overview").hidden) { if (e.key === "Escape") $("overview").hidden = true; return; }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key.toLowerCase() === "t") toggle();
});

// overview
function openAll() {
  $("ovList").innerHTML = CARDS.map((c, k) =>
    '<button class="ov-item' + (k === i ? " current" : "") + '" data-k="' + k + '"><span class="n">' + (k + 1) +
    '</span><span class="t">' + esc(c.t) + '</span><span class="s">' + c.s + "s</span></button>").join("");
  $("ovList").querySelectorAll("button").forEach(b => b.onclick = () => { i = +b.dataset.k; $("overview").hidden = true; render(); });
  $("overview").hidden = false;
}
$("all").onclick = openAll;
$("close").onclick = () => $("overview").hidden = true;

render(); paint();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
